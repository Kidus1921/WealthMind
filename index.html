
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WealthMind AI Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Apply theme immediately to prevent flashing
      (function() {
        // Defaults to light. Only switches to dark if wm_theme is explicitly 'dark'
        const theme = localStorage.getItem('wm_theme') || 'light';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#180c18';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.backgroundColor = '#f9fafb';
        }
      })();

      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              violet: {
                50: "#f7eef7", 100: "#eeddee", 200: "#debade", 300: "#cd98cd", 400: "#bd75bd", 
                500: "#ac53ac", 600: "#8a428a", 700: "#673267", 800: "#452145", 900: "#221122", 950: "#180c18"
              },
              evergreen: {
                50: "#e5fffe", 100: "#ccfffc", 200: "#99fffa", 300: "#66fff7", 400: "#33fff5", 
                500: "#00fff2", 600: "#00ccc2", 700: "#009991", 800: "#006661", 900: "#003330", 950: "#002422"
              },
              lemon: {
                50: "#faf9eb", 100: "#f4f3d7", 200: "#e9e7af", 300: "#dedb87", 400: "#d3cf5f", 
                500: "#c8c337", 600: "#a09c2c", 700: "#787521", 800: "#504e16", 900: "#28270b", 950: "#1c1b08"
              },
              fawn: {
                50: "#f8f5ec", 100: "#f2ebd9", 200: "#e4d7b4", 300: "#d7c28e", 400: "#caae68", 
                500: "#bd9a42", 600: "#977b35", 700: "#715c28", 800: "#4b3e1b", 900: "#261f0d", 950: "#1a1609"
              },
              plum: {
                50: "#f9ebf4", 100: "#f3d8e8", 200: "#e8b0d2", 300: "#dc89bb", 400: "#d062a4", 
                500: "#c43b8d", 600: "#9d2f71", 700: "#762355", 800: "#4f1739", 900: "#270c1c", 950: "#1b0814"
              },
              primary: '#ac53ac',
              secondary: '#00ccc2',
              danger: '#c43b8d',
              dark: '#180c18',
            },
            animation: {
              'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'bounce-slow': 'bounce 3s infinite',
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

    :root { color-scheme: light; }
    html.dark { color-scheme: dark; }
    .wm-shell { background: #f5f3f8; color: #202027; font-family: Inter, sans-serif; }
    .dark .wm-shell { background: #151419; color: #f8f7fb; }
    .wm-sidebar { background: rgba(255,255,255,.94); border-right: 1px solid #ebe8f0; }
    .dark .wm-sidebar { background: #1d1b23; border-color: rgba(255,255,255,.07); }
    .wm-main { background: radial-gradient(ellipse at 80% 0%, rgba(226,213,255,.35), transparent 38%), #f7f6f9; }
    .dark .wm-main { background: radial-gradient(ellipse at 80% 0%, rgba(115,75,160,.12), transparent 38%), #151419; }
    .wm-topbar { background: rgba(255,255,255,.78); border-bottom: 1px solid #ebe8f0; backdrop-filter: blur(18px); }
    .dark .wm-topbar { background: rgba(29,27,35,.85); border-color: rgba(255,255,255,.07); }
    .wm-brand-mark { display:flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:14px; background:#1e1e22; color:#fff; }
    .wm-nav-item { display:flex; align-items:center; gap:13px; width:100%; padding:12px 14px; border-radius:14px; color:#85818e; font-size:13px; font-weight:650; text-align:left; transition:all .2s; }
    .wm-nav-item:hover { color:#28252f; background:#f6f3fa; }
    .dark .wm-nav-item:hover { color:#fff; background:rgba(255,255,255,.06); }
    .wm-nav-item.active { background:#f0eaff; color:#7446bd; }
    .dark .wm-nav-item.active { background:rgba(139,92,246,.16); color:#c4a7ff; }
    .wm-icon-button { display:flex; width:40px; height:40px; align-items:center; justify-content:center; border-radius:14px; color:#716d79; background:#f6f4f8; transition:all .2s; }
    .wm-icon-button:hover { background:#eee8f8; color:#7446bd; }
    .dark .wm-icon-button { color:#c5bdce; background:rgba(255,255,255,.07); }
    .wm-panel,.wm-stat-card { border:1px solid #ece9f1; border-radius:25px; background:#fff; box-shadow:0 5px 24px rgba(38,24,61,.035); }
    .dark .wm-panel,.dark .wm-stat-card { background:#201e26; border-color:rgba(255,255,255,.07); box-shadow:none; }
    .wm-stat-card { padding:22px 24px; }
    .wm-stat-icon { display:flex; width:42px; height:42px; align-items:center; justify-content:center; border-radius:15px; }
    .wm-balance-card { background:linear-gradient(125deg,#232126 0%,#30263c 55%,#4e3475 100%); box-shadow:0 15px 35px rgba(45,31,65,.14); }
\n      body {
        font-family: 'Inter', sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .scrollbar-thin::-webkit-scrollbar {
        width: 6px;
      }
      .scrollbar-thin::-webkit-scrollbar-track {
        background: transparent;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
      }
      .dark .scrollbar-thin::-webkit-scrollbar-thumb {
        background: #452145;
      }
      .glass {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(8px);
      }
      .dark .glass {
        background: rgba(24, 12, 24, 0.8);
        backdrop-filter: blur(8px);
      }
    </style>
